version: '3.8'

services:
  gcs:
    build:
      context: ./gcs
      dockerfile: Dockerfile
    container_name: drone-webgcs
    restart: unless-stopped
    ports:
      - "8083:8083"       # Web Dashboard & WebSocket
      - "14550:14550/udp" # MAVLink Inbound Telemetry
    environment:
      - HOST=0.0.0.0
      - PORT=8083
      - MAVLINK_PORT=14550
      - SITL_ENABLED=true
    volumes:
      - ./gcs/missions:/app/missions
